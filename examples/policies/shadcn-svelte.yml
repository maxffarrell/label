# Optional repository-specific policy fragment, not a core default.
# Merge into this repository's existing .label.yml after maintainer review.
# These rules are NOT used in the same-policy core replay in eval/README.md.
labels:
  bug:
    apply_when: >-
      For issues, a maintainer confirms incorrect existing behavior.
      For PRs, the change fixes incorrect existing behavior.
    remove_when: The item requests new functionality rather than fixing existing behavior.
  awaiting submitter:
    apply_when: >-
      A human maintainer has made a specific outstanding request to the submitter.
      A draft, dependency, upstream release, or submitter asking for review is insufficient.
    remove_when: >-
      A later adequate answer, accepted reproduction, or maintainer approval resolves the request.
  needs reproduction:
    remove_when: >-
      A usable reproduction is supplied, including an identified official demo
      using a plain domain or www URL. A generic documentation link or screenshot
      alone does not establish a reproduction.
  cli:
    apply_when: >-
      The public shadcn-svelte CLI is affected. Installation commands mentioned
      in documentation or changes to an internal build or parity CLI are insufficient.
  good first issue:
    apply_when: A bounded issue invites contribution; an existing implementation PR is insufficient.
  duplicate:
    context: similar_issues
    apply_when: >-
      An identified earlier canonical item covers the same actual scope.
      A fix, implementation, requested replacement PR, upstream cause, follow-up,
      or local upgrade tracker alone is insufficient. Respect maintainer scope clarifications.
